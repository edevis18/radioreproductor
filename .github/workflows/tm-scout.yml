name: AgentPact Exact Need Inspect
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read buyer and need JSON
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const base='https://api.agentpact.xyz/api';
          const targets=[
            ['BUYER_AUTOMATED','/agents/3045a5f3-d501-4317-95a6-d482103b9f2c'],
            ['BUYER_BIO','/agents/c01a3d69-7ecc-4e0f-bdbd-39c3b6e0e557'],
            ['NEED_API_1','/needs/a85fd8a0-f059-4a1c-8d98-bc511455fe18'],
            ['NEED_API_2','/needs/09d4f0e2-873d-47f1-a846-53748ca971ce'],
            ['NEED_BUG','/needs/bdd1fbb2-55d8-47f4-b55e-8ebd50858690'],
            ['NEED_BIO','/needs/32a1f3c2-031d-4714-90f1-ba2b4fd8ff39'],
            ['NEED_CSV','/needs/73a5817e-a9bf-4bd7-9e89-c816bd668743']
          ];
          (async()=>{
            for(const [name,path] of targets){
              try{
                const r=await fetch(base+path,{headers:{accept:'application/json'}});
                const text=await r.text();
                console.log('\n### '+name+' HTTP='+r.status);
                try{ console.log(JSON.stringify(JSON.parse(text),null,2)); }
                catch{ console.log(text.slice(0,12000)); }
              }catch(e){console.log('\n### '+name+' SAFE_ERROR='+String(e.message||e));}
            }
          })();
          NODE
          exit 0
