name: Alluviance Canonical Packet Verify
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact published packet zip
        shell: bash
        run: |
          set +e
          URL='https://raw.githubusercontent.com/johnbpetersen/taskmarket-product-zero/eff11b336a6b753122c3ffad99d706eb575ba4b0/alluviance-product-zero-v0.1.zip'
          EXPECTED='7a8b9fc477698bf86e2cedc98a1cee69503e7a5d575c60ac2ff40d1d8a02166b'
          curl -fL --retry 2 --retry-delay 1 "$URL" -o packet.zip
          RC=$?
          if [ "$RC" -ne 0 ]; then echo "DOWNLOAD_RC=$RC"; exit 0; fi
          BYTES=$(wc -c < packet.zip)
          SHA=$(sha256sum packet.zip | cut -d' ' -f1)
          echo "ZIP_BYTES=$BYTES"
          echo "ZIP_SHA256=$SHA"
          if [ "$SHA" = "$EXPECTED" ]; then echo 'CANONICAL_ZIP_VERIFY=PASS'; else echo 'CANONICAL_ZIP_VERIFY=MISMATCH'; fi
          mkdir -p pkt
          unzip -q packet.zip -d pkt
          cd pkt/* 2>/dev/null || cd pkt
          if [ -f PACKET-SHA256SUMS.txt ]; then sha256sum -c PACKET-SHA256SUMS.txt; fi
          exit 0
