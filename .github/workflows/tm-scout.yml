name: Taskmarket Withdrawal Readiness
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover private signer without logging it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/edevis18/radioreproductor/actions/artifacts/9128054472/zip' -o old-key.zip
          mkdir private-signer && unzip -q old-key.zip -d private-signer
          test -s private-signer/wallet-key.txt
          chmod 600 private-signer/wallet-key.txt
      - name: Inspect first-party gasless USDC withdrawal implementation
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @lucid-agents/taskmarket@latest >/dev/null 2>&1
          ROOT="$(npm root -g)/@lucid-agents/taskmarket/dist/index.js"
          sed -n '8790,8925p' "$ROOT"
      - name: Preserve signer as private Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskmarket-worker-signer-private
          path: private-signer/wallet-key.txt
          retention-days: 7
          if-no-files-found: error
