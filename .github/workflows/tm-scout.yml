name: AgentPact Paid Need Scan
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query public AgentPact needs
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request
          urls=[
            'https://api.agentpact.xyz/api/needs',
            'https://api.agentpact.xyz/api/public/overview'
          ]
          for url in urls:
              print('\n===',url,'===')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'agent-worker/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      print('HTTP',r.status)
                      print(raw[:80000])
              except Exception as e:
                  print('SAFE_ERROR',repr(e))
          PY
          exit 0
