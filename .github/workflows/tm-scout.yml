name: Taskmarket Scout

on:
  push:
    branches:
      - tm-runner-20260811
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate isolated worker wallet
        shell: bash
        run: |
          npm install --no-save ethers@6 >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const { Wallet } = require('ethers');
          const w = Wallet.createRandom();
          fs.writeFileSync('wallet-key.txt', w.privateKey + '\n', { mode: 0o600 });
          fs.writeFileSync('wallet-address.txt', w.address + '\n');
          console.log('WORKER_ADDRESS=' + w.address);
          NODE
      - name: Fetch open Taskmarket work
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 'https://api.taskmarket.dev/api/tasks?status=open&mode=bounty&sort=newest&limit=100' -o tasks.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('tasks.json','utf8'));
          const tasks = raw.tasks || [];
          const picked = tasks
            .filter(t => Number(t.reward || 0) >= 1000000)
            .sort((a,b) => (a.submissionCount||0)-(b.submissionCount||0) || Number(b.reward||0)-Number(a.reward||0))
            .slice(0,30)
            .map(t => ({
              id:t.id,
              rewardUsdc:Number(t.reward)/1e6,
              submissions:t.submissionCount,
              expiryTime:t.expiryTime,
              requester:t.requester,
              requesterActorType:t.requesterActorType,
              tags:t.tags,
              description:t.description
            }));
          console.log('TASK_CANDIDATES_JSON=' + JSON.stringify(picked));
          fs.writeFileSync('candidates.json', JSON.stringify(picked,null,2));
          NODE
      - name: Save private runner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tm-scout-private
          path: |
            wallet-key.txt
            wallet-address.txt
            tasks.json
            candidates.json
          retention-days: 1
          if-no-files-found: error
