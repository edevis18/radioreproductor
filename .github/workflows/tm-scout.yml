name: Taskmarket Lowest Competition Scan
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect all live open tasks and submissions
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const API='https://api.taskmarket.dev';
          async function get(path){
            try{
              const r=await fetch(API+path,{headers:{accept:'application/json'}});
              const text=await r.text(); let d; try{d=JSON.parse(text)}catch{d={raw:text}};
              return {ok:r.ok,status:r.status,data:d};
            }catch(e){return {ok:false,status:0,data:{error:String(e.message||e)}};}
          }
          const arr=d=>Array.isArray(d)?d:(d?.tasks||d?.items||d?.data||[]);
          (async()=>{
            const q=await get('/api/tasks?status=open&limit=100&sort=reward_desc');
            const tasks=arr(q.data);
            const out=[];
            for(const t of tasks){
              const id=t.id||t.taskId;
              const full=await get('/api/tasks/'+id);
              const x=full.ok?full.data:t;
              let subs=null;
              const s=await get('/api/tasks/'+id+'/submissions');
              if(s.ok){const a=Array.isArray(s.data)?s.data:(s.data?.submissions||s.data?.items||[]);subs=a.length;}
              out.push({
                id,
                title:x.title||t.title||null,
                reward:x.reward||x.taskReward||x.rewardAmount||t.reward||null,
                mode:x.mode||x.taskMode||t.mode||null,
                status:x.status||x.taskStatus||t.status||null,
                submissions:subs ?? x.submissionCount ?? t.submissionCount ?? null,
                expiry:x.expiryTime||x.expiresAt||x.deadline||t.expiryTime||null,
                description:String(x.description||x.taskDescription||t.description||'').replace(/\s+/g,' ').slice(0,2200),
                requirements:x.requirements||x.acceptanceCriteria||x.criteria||null,
                deliverable:x.deliverable||x.deliverableType||null,
                repo:x.repository||x.repo||x.repositoryUrl||null,
                stakeRequired:x.stakeRequired??x.requiresStake??null,
                pendingActions:x.pendingActions||null
              });
            }
            out.sort((a,b)=>(Number(a.submissions??999)-Number(b.submissions??999)) || (Number(b.reward||0)-Number(a.reward||0)));
            console.log('LIVE_TASKS='+JSON.stringify(out));
          })().catch(e=>console.log('SAFE_STOP='+String(e.message||e)));
          NODE
          exit 0
