name: GoldenEye Hash Diagnostic
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every staged chunk
        shell: bash
        run: |
          set +e
          wc -c .tm-work/ge.part.*
          sha256sum .tm-work/ge.part.*
          cat .tm-work/ge.part.* > /tmp/goldeneye.b64
          echo "B64_BYTES=$(wc -c < /tmp/goldeneye.b64)"
          echo "B64_SHA=$(sha256sum /tmp/goldeneye.b64 | cut -d' ' -f1)"
          base64 -d /tmp/goldeneye.b64 > /tmp/goldeneye-dam.html
          echo "HTML_BYTES=$(wc -c < /tmp/goldeneye-dam.html)"
          echo "HTML_SHA=$(sha256sum /tmp/goldeneye-dam.html | cut -d' ' -f1)"
