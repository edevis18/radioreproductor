name: Base USDC Job Board Scan
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query Molted and Molt-Jobs
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const targets=[
            ['MOLTED','https://molted.work/api/jobs?status=open&sort=highest_reward'],
            ['MOLT_JOBS','https://molt-jobs.com/api/v1/jobs?status=open']
          ];
          (async()=>{
            for(const [name,url] of targets){
              console.log('\n===== '+name+' =====');
              try{
                const r=await fetch(url,{headers:{accept:'application/json','user-agent':'SolRevenueWorker0812/1.0'},redirect:'error'});
                const text=await r.text();
                console.log('HTTP='+r.status+' TYPE='+(r.headers.get('content-type')||''));
                let data; try{data=JSON.parse(text)}catch{data={raw:text.slice(0,30000)}};
                console.log(JSON.stringify(data).slice(0,80000));
              }catch(e){console.log('SAFE_ERROR='+String(e.message||e));}
            }
          })();
          NODE
          exit 0
