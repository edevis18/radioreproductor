name: Taskmarket Settlement Check
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check our submitted work only
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const API='https://api.taskmarket.dev';
          const worker='0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de'.toLowerCase();
          const tasks=[
            ['GoldenEye','0x2c85f49583e4f402fed28f19210de17ab8fcc4edd1cdff43d53560e358bce917','2d4cee58-c361-40f5-b003-518d73798655'],
            ['Alluviance','0xe9fb8fe4e6f83b54d4850efd1c5b6aef6d1bbd7f9f91921d4329f404e64c5682',null]
          ];
          async function get(path){
            try{
              const r=await fetch(API+path,{headers:{accept:'application/json'}});
              const text=await r.text(); let data; try{data=JSON.parse(text)}catch{data={raw:text.slice(0,3000)}};
              return {ok:r.ok,status:r.status,data};
            }catch(e){return {ok:false,status:0,data:{error:String(e.message||e)}};}
          }
          const arr=d=>Array.isArray(d)?d:(d?.submissions||d?.items||d?.data||[]);
          (async()=>{
            for(const [name,taskId,knownSubmission] of tasks){
              const task=await get('/api/tasks/'+taskId);
              console.log(`TASK ${name} HTTP=${task.status} DATA=${JSON.stringify(task.data).slice(0,8000)}`);
              const s=await get('/api/tasks/'+taskId+'/submissions');
              const rows=arr(s.data);
              const ours=rows.filter(x=>{
                const w=String(x.workerAddress||x.worker_address||x.worker||'').toLowerCase();
                const id=String(x.id||x.submissionId||x.submission_id||'');
                return w===worker || (knownSubmission && id===knownSubmission);
              });
              console.log(`OURS ${name} HTTP=${s.status} COUNT=${ours.length} DATA=${JSON.stringify(ours).slice(0,12000)}`);
            }
            const workerPaths=[
              `/api/workers/${worker}`,
              `/api/workers/${worker}/balance`,
              `/api/wallet/${worker}/balance`,
              `/api/earnings?workerAddress=${worker}`
            ];
            for(const p of workerPaths){
              const x=await get(p); console.log(`WORKER_PATH ${p} HTTP=${x.status} DATA=${JSON.stringify(x.data).slice(0,5000)}`);
            }
          })().catch(e=>console.log('SAFE_STOP='+String(e.message||e)));
          NODE
          exit 0
