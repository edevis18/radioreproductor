name: Taskmarket Exact Submit

on:
  push:
    branches:
      - tm-runner-20260811

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct verified audit
        shell: bash
        run: |
          set -euo pipefail
          cat .tm-work/chunk_* | base64 -d > submission.zip
          echo '505493119e95e3a56d0e70a6f73ea0efac40a4270d3be528cac1d09f774e33cb  submission.zip' | sha256sum -c -
          mkdir submission
          unzip -q submission.zip -d submission
          echo 'c1d071da78d07e948da25500ea2d7bab58a565decee5ad59cdb294ad2e89b667  submission/AUDIT-REPORT.md' | sha256sum -c -
          echo '63c79fadf19817e326cac2032c1b614a973eae91b86a6fd7b88b9207c9a31671  submission/FINDINGS.json' | sha256sum -c -
          echo '481ed681bbb27157c89b969e1b7d219af7f7f6d8ee6ff694d73d02c8e486f494  submission/METHOD.md' | sha256sum -c -

      - name: Recover isolated worker key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/edevis18/radioreproductor/actions/artifacts/9128054472/zip' -o worker-key.zip
          mkdir worker-key
          unzip -q worker-key.zip -d worker-key
          test -s worker-key/wallet-key.txt
          chmod 600 worker-key/wallet-key.txt

      - name: Execute current Taskmarket two-stage protocol
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save ethers@6 >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { Wallet, keccak256 } = require('ethers');

          const API = 'https://api.taskmarket.dev';
          const taskId = '0xe9fb8fe4e6f83b54d4850efd1c5b6aef6d1bbd7f9f91921d4329f404e64c5682';
          const expectedWorker = '0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de';
          const destination = '0xaef477d65c9f5679f8a6221146ec0979306f906a';
          const pk = fs.readFileSync('worker-key/wallet-key.txt','utf8').trim();
          const wallet = new Wallet(pk);
          if (wallet.address.toLowerCase() !== expectedWorker.toLowerCase()) throw new Error('worker key/address mismatch');

          const files = [
            { fileName:'AUDIT-REPORT.md', mimeType:'text/markdown', role:'attachment' },
            { fileName:'FINDINGS.json', mimeType:'application/json', role:'attachment' },
            { fileName:'METHOD.md', mimeType:'text/markdown', role:'attachment' },
          ];

          async function postJson(path, body, idempotencyKey) {
            const headers = { 'content-type':'application/json', 'accept':'application/json' };
            if (idempotencyKey) headers['X-Taskmarket-Idempotency-Key'] = idempotencyKey;
            const r = await fetch(API + path, { method:'POST', headers, body:JSON.stringify(body), redirect:'error' });
            const text = await r.text();
            let data; try { data = JSON.parse(text); } catch { data = { raw:text }; }
            return { status:r.status, ok:r.ok, headers:Object.fromEntries(r.headers.entries()), data };
          }

          async function getJson(path, headers={}) {
            const r = await fetch(API + path, { headers:{accept:'application/json',...headers}, redirect:'error' });
            const text = await r.text();
            let data; try { data = JSON.parse(text); } catch { data = { raw:text }; }
            return { status:r.status, ok:r.ok, data };
          }

          async function main() {
            const receipt = { workerAddress:wallet.address, destination, taskId, stages:[], startedAt:new Date().toISOString() };
            try {
              const initialSig = await wallet.signMessage(`taskmarket:submit:${taskId}`);
              const artifacts = [];
              for (const f of files) {
                const bytes = fs.readFileSync(`submission/${f.fileName}`);
                const idem = crypto.randomUUID();
                const req = await postJson(`/api/tasks/${taskId}/submissions/request-upload-url`, {
                  taskId,
                  workerAddress: wallet.address,
                  signature: initialSig,
                  fileName: f.fileName,
                  mimeType: f.mimeType,
                  role: f.role,
                  sizeBytes: bytes.length,
                }, idem);
                receipt.stages.push({ stage:`request-upload:${f.fileName}`, status:req.status, response:req.data });
                if (!req.ok) {
                  if (req.status === 402) throw new Error(`PAYMENT_REQUIRED during upload-url for ${f.fileName}`);
                  throw new Error(`upload-url failed ${req.status}: ${JSON.stringify(req.data)}`);
                }
                const { uploadUrl, artifactKey } = req.data;
                if (!uploadUrl || !artifactKey) throw new Error(`missing uploadUrl/artifactKey for ${f.fileName}`);
                const put = await fetch(uploadUrl, { method:'PUT', headers:{'content-type':f.mimeType,'content-length':String(bytes.length)}, body:bytes, redirect:'error' });
                const putText = await put.text();
                receipt.stages.push({ stage:`upload:${f.fileName}`, status:put.status, response:putText.slice(0,300) });
                if (!put.ok) throw new Error(`PUT upload failed ${put.status} for ${f.fileName}`);
                artifacts.push({
                  artifactKey,
                  fileName:f.fileName,
                  mimeType:f.mimeType,
                  role:f.role,
                  sizeBytes:bytes.length,
                  sha256Hash:crypto.createHash('sha256').update(bytes).digest('hex'),
                  keccak256Hash:keccak256(bytes),
                });
              }

              const binding = artifacts.map(a=>a.artifactKey).join(',');
              const finalSig = await wallet.signMessage(`taskmarket:submit:${taskId}:${binding}`);
              const idem = crypto.randomUUID();
              const submit = await postJson(`/api/tasks/${taskId}/submissions/from-keys`, {
                taskId,
                workerAddress:wallet.address,
                artifacts,
                signature:finalSig,
              }, idem);
              receipt.stages.push({ stage:'submit-from-keys', status:submit.status, response:submit.data, idempotencyKey:idem });
              if (!submit.ok) {
                if (submit.status === 402) throw new Error('PAYMENT_REQUIRED during final submission');
                throw new Error(`final submit failed ${submit.status}: ${JSON.stringify(submit.data)}`);
              }
              receipt.submission = submit.data;

              const readSig = await wallet.signMessage(`taskmarket:read:${wallet.address.toLowerCase()}`);
              const mine = await getJson(`/api/submissions/mine?workerAddress=${encodeURIComponent(wallet.address)}`, {
                'X-Taskmarket-Caller-Address':wallet.address,
                'X-Taskmarket-Caller-Signature':readSig,
              });
              receipt.stages.push({ stage:'verify-my-submissions', status:mine.status, response:mine.data });

              const task = await getJson(`/api/tasks/${taskId}`);
              receipt.stages.push({ stage:'verify-task', status:task.status, response:task.data });

              const withdrawalSig = await wallet.signMessage(`taskmarket:set-withdrawal-address:${destination.toLowerCase()}`);
              const setWithdrawal = await postJson('/api/wallet/set-withdrawal-address', {
                walletAddress:wallet.address,
                withdrawalAddress:destination,
                signature:withdrawalSig,
              }, crypto.randomUUID());
              receipt.stages.push({ stage:'set-withdrawal-address', status:setWithdrawal.status, response:setWithdrawal.data });
              if (setWithdrawal.ok) receipt.withdrawalAddress = setWithdrawal.data.withdrawalAddress;

              receipt.completedAt = new Date().toISOString();
              fs.writeFileSync('exact-submit-receipt.json', JSON.stringify(receipt,null,2));
              console.log('SUBMISSION_RESPONSE=' + JSON.stringify(submit.data));
              console.log('WITHDRAWAL_STATUS=' + setWithdrawal.status);
              console.log('WITHDRAWAL_RESPONSE=' + JSON.stringify(setWithdrawal.data));
            } catch (e) {
              receipt.error = String(e && e.message || e);
              receipt.failedAt = new Date().toISOString();
              fs.writeFileSync('exact-submit-receipt.json', JSON.stringify(receipt,null,2));
              console.error('SAFE_STOP=' + receipt.error);
              process.exit(2);
            }
          }
          main();
          NODE

      - name: Save safe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskmarket-exact-submit-receipt
          path: exact-submit-receipt.json
          retention-days: 1
          if-no-files-found: warn
