name: GoldenEye Chunk Diagnostic
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash staged chunks
        shell: bash
        run: |
          set +e
          wc -c .tm-work/ge.part.*
          sha256sum .tm-work/ge.part.*
          cat .tm-work/ge.part.* > goldeneye.b64
          echo "TOTAL_B64=$(wc -c < goldeneye.b64)"
          sha256sum goldeneye.b64
          base64 -d goldeneye.b64 > goldeneye-dam.html
          echo "HTML_BYTES=$(wc -c < goldeneye-dam.html)"
          sha256sum goldeneye-dam.html
