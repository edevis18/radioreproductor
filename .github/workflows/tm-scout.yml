name: GoldenEye Chunk Export
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare suspect chunks
        run: |
          mkdir export
          cp .tm-work/ge.part.00 export/current.part.00
          cp .tm-work/ge.part.02 export/current.part.02
          sha256sum export/*
      - uses: actions/upload-artifact@v4
        with:
          name: goldeneye-suspect-chunks
          path: export/
          retention-days: 1
