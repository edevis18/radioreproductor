name: USDC Market Zero-Cost Scan
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query MoltBridge Augmi and MYA
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const targets=[
            ['MOLTBRIDGE','https://api.moltbridge.xyz/v1/tasks?status=OPEN&limit=100'],
            ['AUGMI','https://augmi.world/api/marketplace/bounties?status=OPEN'],
            ['MYA','https://www.monetizeyouragent.fun/api/v1/jobs']
          ];
          (async()=>{
            for(const [name,url] of targets){
              console.log('\n===== '+name+' =====');
              try{
                const r=await fetch(url,{headers:{accept:'application/json','user-agent':'SolRevenueWorker0812/1.0'},redirect:'error'});
                const text=await r.text();
                console.log('HTTP='+r.status+' TYPE='+(r.headers.get('content-type')||''));
                let data; try{data=JSON.parse(text)}catch{data={raw:text.slice(0,20000)}};
                const scrub=o=>{
                  if(Array.isArray(o)) return o.map(scrub);
                  if(o&&typeof o==='object'){
                    const x={}; for(const [k,v] of Object.entries(o)){
                      if(/secret|private|api.?key|token/i.test(k)) x[k]='[REDACTED]'; else x[k]=scrub(v);
                    } return x;
                  } return o;
                };
                console.log(JSON.stringify(scrub(data)).slice(0,70000));
              }catch(e){ console.log('SAFE_ERROR='+String(e.message||e)); }
            }
          })();
          NODE
          exit 0
