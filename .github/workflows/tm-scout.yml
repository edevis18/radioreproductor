name: BountyBook Live Scan
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Query live BountyBook API
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request
          base='https://api.bountybook.ai'
          for path in ['/jobs?status=open&limit=50','/jobs?status=claimed&limit=50','/stats']:
              print('\n===',path,'===')
              try:
                  req=urllib.request.Request(base+path,headers={'User-Agent':'agent-worker/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8','replace')
                      print('HTTP',r.status)
                      print(raw[:60000])
              except Exception as e:
                  print('SAFE_ERROR',repr(e))
          PY
          exit 0
