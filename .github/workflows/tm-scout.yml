name: Taskmarket Withdrawal Protocol
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @lucid-agents/taskmarket@latest >/dev/null 2>&1
      - name: Print exact USDC withdrawal implementation
        shell: bash
        run: |
          ROOT="$(npm root -g)/@lucid-agents/taskmarket/dist/index.js"
          sed -n '8920,8995p' "$ROOT"
