name: Taskmarket Requester Quality Check
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Score requester payment history
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const API='https://api.taskmarket.dev';
          const requesters=[
            ['GoldenEye','0x683bfEE2e685E6061EaC3e3d33Eee7ae5807E6c7'],
            ['Alluviance','0x64b466023d360938DbFa8c1df74FAE442b9B2555']
          ];
          async function get(path){
            try{
              const r=await fetch(API+path,{headers:{accept:'application/json'}});
              const text=await r.text(); let d; try{d=JSON.parse(text)}catch{d={raw:text.slice(0,3000)}};
              return {ok:r.ok,status:r.status,data:d};
            }catch(e){return {ok:false,status:0,data:{error:String(e.message||e)}};}
          }
          (async()=>{
            for(const [name,address] of requesters){
              const stats=await get('/api/agents/stats?address='+encodeURIComponent(address));
              console.log(`STATS ${name} HTTP=${stats.status} DATA=${JSON.stringify(stats.data).slice(0,7000)}`);
              const hist=await get('/api/tasks?status=ALL&requester='+encodeURIComponent(address)+'&limit=100&sort=newest');
              const rows=Array.isArray(hist.data)?hist.data:(hist.data?.tasks||hist.data?.items||[]);
              const summary={total:rows.length,completed:0,open:0,expired:0,cancelled:0,other:0,totalReward:0,totalAwarded:0,tasks:[]};
              for(const t of rows){
                const st=String(t.status||'').toLowerCase();
                if(st==='completed') summary.completed++; else if(st==='open')summary.open++; else if(st==='expired')summary.expired++; else if(st==='cancelled')summary.cancelled++; else summary.other++;
                summary.totalReward+=Number(t.reward||0)/1e6;
                const awards=Array.isArray(t.awards)?t.awards:[];
                summary.totalAwarded+=awards.reduce((s,a)=>s+Number(a.amount||a.reward||a.payout||0)/1e6,0);
                summary.tasks.push({id:t.id,status:t.status,reward:Number(t.reward||0)/1e6,awardCount:t.awardCount??awards.length,createdAt:t.createdAt,expiryTime:t.expiryTime,submissionCount:t.submissionCount});
              }
              console.log(`HISTORY ${name} HTTP=${hist.status} SUMMARY=${JSON.stringify(summary).slice(0,20000)}`);
            }
          })().catch(e=>console.log('SAFE_STOP='+String(e.message||e)));
          NODE
          exit 0
