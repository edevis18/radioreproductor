name: Taskmarket Live Open Task Rank
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rank all live open tasks
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const API='https://api.taskmarket.dev';
          (async()=>{
            const r=await fetch(`${API}/api/tasks?status=open&limit=100&sort=reward_desc`,{headers:{accept:'application/json'}});
            const d=await r.json(); const rows=Array.isArray(d)?d:(d.tasks||d.items||[]);
            const out=rows.map(t=>({
              id:t.id||t.taskId,
              reward:t.reward||t.taskReward||t.rewardAmount||t.rewardBaseUnits,
              mode:t.mode||t.taskMode,
              status:t.status||t.taskStatus,
              submissionCount:t.submissionCount??null,
              pitchCount:t.pitchCount??null,
              title:t.title||null,
              description:String(t.description||t.taskDescription||'').replace(/\s+/g,' ').slice(0,900),
              expiry:t.expiryTime||t.expiresAt||t.deadline||null,
              stakeRequired:t.stakeRequired??t.requiresStake??null,
              stakeAmount:t.stakeAmount??t.claimStakeAmount??null,
              pendingActions:(t.pendingActions||[]).map(a=>({role:a.role,action:a.action,requiresPayment:a.requiresPayment,paymentAmount:a.paymentAmount,availableUntil:a.availableUntil}))
            }));
            console.log('OPEN_TASKS='+JSON.stringify(out));
          })().catch(e=>console.log('RANK_SAFE_STOP='+e.message));
          NODE
          exit 0
