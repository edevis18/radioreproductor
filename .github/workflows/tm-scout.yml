name: Taskmarket CLI Inspect

on:
  push:
    branches:
      - tm-runner-20260811
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Taskmarket CLI
        shell: bash
        run: npm install -g @lucid-agents/taskmarket@latest
      - name: Inspect exact non-interactive commands
        shell: bash
        run: |
          set +e
          echo '=== VERSION ==='
          taskmarket --version
          echo '=== WALLET IMPORT HELP ==='
          taskmarket wallet import --help
          echo '=== SUBMIT HELP ==='
          taskmarket task submit --help
          echo '=== LEGAL STATUS HELP ==='
          taskmarket legal status --help
          echo '=== LEGAL ACCEPT HELP ==='
          taskmarket legal accept --help
          echo '=== WITHDRAWAL HELP ==='
          taskmarket wallet set-withdrawal-address --help
