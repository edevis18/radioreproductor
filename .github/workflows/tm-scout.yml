name: Taskmarket Safe USDC Payout
on:
  push:
    branches: [tm-runner-20260811]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check balance and immutable Base USDC destination
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          WORKER='0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de'
          DEST='0xaef477d65c9f5679f8a6221146ec0979306f906a'
          BAL="$(curl -fsSL "https://api.taskmarket.dev/api/wallet/balance?address=$WORKER")"
          WD="$(curl -fsSL "https://api.taskmarket.dev/api/wallet/withdrawal-address?address=$WORKER")"
          python3 - "$BAL" "$WD" "$DEST" <<'PY'
          import json,sys
          b=json.loads(sys.argv[1]); w=json.loads(sys.argv[2]); d=sys.argv[3].lower()
          amount=int(b.get('balanceBaseUnits','0')); dom=w.get('usdcDomain') or {}
          assert w.get('withdrawalAddress','').lower()==d
          assert int(dom.get('chainId',0))==8453
          assert dom.get('verifyingContract','').lower()=='0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
          print(f'PREFLIGHT_BALANCE_USDC={amount/1_000_000:.6f}')
          open('/tmp/amount','w').write(str(amount))
          PY
          echo "amount=$(cat /tmp/amount)" >> "$GITHUB_OUTPUT"
      - name: Recover private signer only if earned funds exist
        if: steps.preflight.outputs.amount != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/edevis18/radioreproductor/actions/artifacts/9129044406/zip' -o signer.zip
          mkdir signer && unzip -q signer.zip -d signer
          test -s signer/wallet-key.txt && chmod 600 signer/wallet-key.txt
      - name: Withdraw all earned USDC using EIP-3009 gasless authorization
        if: steps.preflight.outputs.amount != '0'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save ethers@6 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'); const {Wallet,hexlify,randomBytes}=require('ethers');
          const API='https://api.taskmarket.dev', FROM='0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de', TO='0xaef477d65c9f5679f8a6221146ec0979306f906a', USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const wallet=new Wallet(fs.readFileSync('signer/wallet-key.txt','utf8').trim()); if(wallet.address.toLowerCase()!==FROM.toLowerCase())throw new Error('signer mismatch');
          const types={TransferWithAuthorization:[{name:'from',type:'address'},{name:'to',type:'address'},{name:'value',type:'uint256'},{name:'validAfter',type:'uint256'},{name:'validBefore',type:'uint256'},{name:'nonce',type:'bytes32'}]};
          async function get(p){const r=await fetch(API+p,{headers:{accept:'application/json'}});if(!r.ok)throw new Error(`GET ${r.status}`);return r.json()}
          async function main(){const b=await get(`/api/wallet/balance?address=${FROM}`), amount=String(BigInt(b.balanceBaseUnits||'0')); if(amount==='0'){console.log('NO_WITHDRAWABLE_BALANCE');return} const w=await get(`/api/wallet/withdrawal-address?address=${FROM}`), dom=w.usdcDomain||{}; if((w.withdrawalAddress||'').toLowerCase()!==TO.toLowerCase()||Number(dom.chainId)!==8453||(dom.verifyingContract||'').toLowerCase()!==USDC.toLowerCase())throw new Error('destination/domain mismatch'); const now=Math.floor(Date.now()/1000), authorization={from:FROM,to:TO,value:amount,validAfter:String(now-60),validBefore:String(now+300),nonce:hexlify(randomBytes(32))}; const signature=await wallet.signTypedData(dom,types,authorization); const r=await fetch(API+'/api/wallet/withdraw',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','X-Taskmarket-Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({from:FROM,amountBaseUnits:amount,authorization,signature}),redirect:'error'}); const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={raw:text}}; if(r.status===402)throw new Error('PAYMENT_REQUIRED: refused'); if(!r.ok)throw new Error(`withdraw HTTP ${r.status}: ${JSON.stringify(data)}`); if((data.to||'').toLowerCase()!==TO.toLowerCase())throw new Error('unexpected payout destination'); const receipt={txHash:data.txHash,amountBaseUnits:data.amountBaseUnits,to:data.to,amountUsdc:(Number(data.amountBaseUnits)/1e6).toFixed(6),at:new Date().toISOString()}; fs.writeFileSync('payout-receipt.json',JSON.stringify(receipt,null,2)); console.log('PAYOUT_RECEIPT='+JSON.stringify(receipt));}
          main().catch(e=>{console.error('SAFE_STOP='+e.message);process.exit(2)});
          NODE
      - name: Save transfer receipt
        if: steps.preflight.outputs.amount != '0'
        uses: actions/upload-artifact@v4
        with:
          name: taskmarket-payout-receipt
          path: payout-receipt.json
          retention-days: 7
          if-no-files-found: warn
