name: Taskmarket Signing Inspect

on:
  push:
    branches:
      - tm-runner-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Taskmarket CLI
        run: npm install -g @lucid-agents/taskmarket@latest
      - name: Locate submission signing implementation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(npm root -g)/@lucid-agents/taskmarket"
          echo "PACKAGE_ROOT=$ROOT"
          echo '=== MATCHES ==='
          grep -RniE 'submit.*signature|signature.*submit|workerAddress|signMessage|personal_sign|submissions' "$ROOT" --include='*.js' --include='*.mjs' --include='*.cjs' | head -n 120 || true
          echo '=== FILE LIST ==='
          find "$ROOT" -maxdepth 3 -type f | sort | head -n 120
