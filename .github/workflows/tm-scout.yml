name: GoldenEye Repair Diagnostic
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test exact repair candidates
        shell: bash
        run: |
          set +e
          EXPECTED='c43b1707a3d8b4ac548be58b1731c5120a6150a7a5594a46b3dfc79e01776af2'
          echo "EXPECTED=$EXPECTED"

          # Candidate A: ge.part.00 has an accidental 3970-byte prefix; keep its final 6000 bytes.
          tail -c 6000 .tm-work/ge.part.00 > /tmp/a0
          cat /tmp/a0 .tm-work/ge.part.01 .tm-work/ge.part.02 .tm-work/ge.part.03 .tm-work/ge.part.04 .tm-work/ge.part.05 .tm-work/ge.part.06 > /tmp/candidate-a.b64
          echo "A_B64_BYTES=$(wc -c < /tmp/candidate-a.b64)"
          base64 -d /tmp/candidate-a.b64 > /tmp/a.html 2>/tmp/a.err
          echo "A_DECODE_RC=$?"
          echo "A_HTML_BYTES=$(wc -c < /tmp/a.html)"
          A_SHA=$(sha256sum /tmp/a.html | cut -d' ' -f1)
          echo "A_SHA=$A_SHA"
          [ "$A_SHA" = "$EXPECTED" ] && echo 'REPAIR=A' || true

          # Candidate B: ge.part.00 has accidental trailing data; keep its first 6000 bytes.
          head -c 6000 .tm-work/ge.part.00 > /tmp/b0
          cat /tmp/b0 .tm-work/ge.part.01 .tm-work/ge.part.02 .tm-work/ge.part.03 .tm-work/ge.part.04 .tm-work/ge.part.05 .tm-work/ge.part.06 > /tmp/candidate-b.b64
          echo "B_B64_BYTES=$(wc -c < /tmp/candidate-b.b64)"
          base64 -d /tmp/candidate-b.b64 > /tmp/b.html 2>/tmp/b.err
          echo "B_DECODE_RC=$?"
          echo "B_HTML_BYTES=$(wc -c < /tmp/b.html)"
          B_SHA=$(sha256sum /tmp/b.html | cut -d' ' -f1)
          echo "B_SHA=$B_SHA"
          [ "$B_SHA" = "$EXPECTED" ] && echo 'REPAIR=B' || true

          # Candidate C: use chunk_00 as the first 6000 bytes, then ge.part.01..06.
          cat .tm-work/chunk_00 .tm-work/ge.part.01 .tm-work/ge.part.02 .tm-work/ge.part.03 .tm-work/ge.part.04 .tm-work/ge.part.05 .tm-work/ge.part.06 > /tmp/candidate-c.b64
          echo "C_B64_BYTES=$(wc -c < /tmp/candidate-c.b64)"
          base64 -d /tmp/candidate-c.b64 > /tmp/c.html 2>/tmp/c.err
          echo "C_DECODE_RC=$?"
          echo "C_HTML_BYTES=$(wc -c < /tmp/c.html)"
          C_SHA=$(sha256sum /tmp/c.html | cut -d' ' -f1)
          echo "C_SHA=$C_SHA"
          [ "$C_SHA" = "$EXPECTED" ] && echo 'REPAIR=C' || true

          exit 0
