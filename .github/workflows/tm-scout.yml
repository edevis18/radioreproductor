name: Taskmarket Balance Check
on:
  push:
    branches: [tm-runner-20260811]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query public wallet payout state
        shell: bash
        run: |
          set -euo pipefail
          ADDR='0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de'
          echo -n 'BALANCE='; curl -fsSL "https://api.taskmarket.dev/api/wallet/balance?address=$ADDR"; echo
          echo -n 'WITHDRAWAL='; curl -fsSL "https://api.taskmarket.dev/api/wallet/withdrawal-address?address=$ADDR"; echo
