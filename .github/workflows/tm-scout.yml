name: Paintbot League Inspect

on:
  push:
    branches:
      - tm-runner-20260811

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public leaderboard and participation guide
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://softmax.com/api/observatory/v2/divisions/div_aa7825db-262f-4a62-b01a-177c1b48f7ee/leaderboard?include_recent_rounds=0' -o leaderboard.json
          curl -fsSL 'https://softmax.com/api/observatory/v2/participate?league_id=league_b8fa9b35-ac22-48cf-a03f-07b397aff1c7' -o participate.txt
          echo '=== LEADERBOARD ==='
          cat leaderboard.json
          echo
          echo '=== PARTICIPATION ==='
          cat participate.txt
