name: Taskmarket Audit Packet

on:
  push:
    branches:
      - tm-runner-20260811
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify frozen packet
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 'https://raw.githubusercontent.com/johnbpetersen/taskmarket-product-zero/eff11b336a6b753122c3ffad99d706eb575ba4b0/alluviance-product-zero-v0.1.zip' -o alluviance-product-zero-v0.1.zip
          echo '7a8b9fc477698bf86e2cedc98a1cee69503e7a5d575c60ac2ff40d1d8a02166b  alluviance-product-zero-v0.1.zip' | sha256sum -c -
          mkdir packet
          unzip -q alluviance-product-zero-v0.1.zip -d packet
          find packet -maxdepth 3 -type f -printf '%p\n' | sort
      - name: Upload verified packet
        uses: actions/upload-artifact@v4
        with:
          name: alluviance-frozen-packet
          path: packet/
          retention-days: 1
          if-no-files-found: error
