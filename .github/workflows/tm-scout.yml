name: Taskmarket GoldenEye Submit

on:
  push:
    branches:
      - tm-runner-20260811

permissions:
  contents: read
  actions: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconstruct and verify HTML
        shell: bash
        run: |
          set -euo pipefail
          cat .tm-work/ge.part.* > goldeneye.b64
          test "$(wc -c < goldeneye.b64)" -eq 38548
          base64 -d goldeneye.b64 > goldeneye-dam.html
          echo 'c43b1707a3d8b4ac548be58b1731c5120a6150a7a5594a46b3dfc79e01776af2  goldeneye-dam.html' | sha256sum -c -
          test "$(wc -c < goldeneye-dam.html)" -eq 28909
          python3 - <<'PY'
          from pathlib import Path
          s=Path('goldeneye-dam.html').read_text()
          assert 'three@0.185.1' in s
          assert 'COMBAT_CONFIG' in s and 'REFERENCE_METRICS' in s
          assert "guardCount:game.guards.length" in s
          print('HTML_STATIC_CHECK=PASS')
          PY
      - name: Recover isolated worker key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/edevis18/radioreproductor/actions/artifacts/9128054472/zip' -o worker-key.zip
          mkdir worker-key
          unzip -q worker-key.zip -d worker-key
          test -s worker-key/wallet-key.txt
          chmod 600 worker-key/wallet-key.txt
      - name: Sign and submit GoldenEye artifact
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save ethers@6 >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {Wallet,keccak256}=require('ethers');
          const API='https://api.taskmarket.dev';
          const taskId='0x2c85f49583e4f402fed28f19210de17ab8fcc4edd1cdff43d53560e358bce917';
          const expectedWorker='0x073F1b940fB6bb86Fe8dc0f627cCF3a78471A0de';
          const wallet=new Wallet(fs.readFileSync('worker-key/wallet-key.txt','utf8').trim());
          if(wallet.address.toLowerCase()!==expectedWorker.toLowerCase()) throw new Error('worker mismatch');
          const bytes=fs.readFileSync('goldeneye-dam.html');
          async function post(path,body,key){
            const h={'content-type':'application/json','accept':'application/json'};
            if(key) h['X-Taskmarket-Idempotency-Key']=key;
            const r=await fetch(API+path,{method:'POST',headers:h,body:JSON.stringify(body),redirect:'error'});
            const t=await r.text(); let d; try{d=JSON.parse(t)}catch{d={raw:t}};
            return {ok:r.ok,status:r.status,data:d};
          }
          async function main(){
            const receipt={taskId,workerAddress:wallet.address,startedAt:new Date().toISOString(),stages:[]};
            const sig1=await wallet.signMessage(`taskmarket:submit:${taskId}`);
            const u=await post(`/api/tasks/${taskId}/submissions/request-upload-url`,{
              taskId,workerAddress:wallet.address,signature:sig1,fileName:'goldeneye-dam.html',mimeType:'text/html',role:'attachment',sizeBytes:bytes.length
            },crypto.randomUUID());
            receipt.stages.push({stage:'request-upload',status:u.status,response:u.data});
            if(!u.ok){if(u.status===402) throw new Error('PAYMENT_REQUIRED'); throw new Error('upload-url '+u.status+' '+JSON.stringify(u.data));}
            const {uploadUrl,artifactKey}=u.data;
            const put=await fetch(uploadUrl,{method:'PUT',headers:{'content-type':'text/html','content-length':String(bytes.length)},body:bytes,redirect:'error'});
            const putText=await put.text(); receipt.stages.push({stage:'upload',status:put.status,response:putText.slice(0,200)});
            if(!put.ok) throw new Error('upload '+put.status);
            const artifact={artifactKey,fileName:'goldeneye-dam.html',mimeType:'text/html',role:'attachment',sizeBytes:bytes.length,sha256Hash:crypto.createHash('sha256').update(bytes).digest('hex'),keccak256Hash:keccak256(bytes)};
            const sig2=await wallet.signMessage(`taskmarket:submit:${taskId}:${artifactKey}`);
            const s=await post(`/api/tasks/${taskId}/submissions/from-keys`,{taskId,workerAddress:wallet.address,artifacts:[artifact],signature:sig2},crypto.randomUUID());
            receipt.stages.push({stage:'submit',status:s.status,response:s.data});
            if(!s.ok){if(s.status===402) throw new Error('PAYMENT_REQUIRED'); throw new Error('submit '+s.status+' '+JSON.stringify(s.data));}
            receipt.submission=s.data; receipt.completedAt=new Date().toISOString();
            fs.writeFileSync('goldeneye-submit-receipt.json',JSON.stringify(receipt,null,2));
            console.log('SUBMISSION_RESPONSE='+JSON.stringify(s.data));
          }
          main().catch(e=>{console.error('SAFE_STOP='+e.message);process.exit(2)});
          NODE
      - name: Save safe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldeneye-submit-receipt
          path: goldeneye-submit-receipt.json
          retention-days: 1
          if-no-files-found: warn
